<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Management - Internet Cafe</title>
    <link rel="stylesheet" href="CM.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <a href="#">InternetCafe</a>
        </div>
        
        <ul class="sidebar-menu">
            <li>Dashboard</li>
            <li>Account</li>
            <li class="active">Computer Management</li>
            <li>Customer Management</li>
            <li>Reports & Statistics</li>
            <li>Setting</li>
        </ul>
        
        <div class="logout-section">
            <button class="logout-button">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card-header">
            <h1>Computer Management</h1>
        </div>
        
        <div class="management-card">
            
            <div class="input-grid row-2">
                <div class="input-field">
                    <input type="text" placeholder="Mã Máy">
                </div>
                <div class="input-field">
                    <input type="text" placeholder="Tên Máy">
                </div>
                <div class="input-field">
                    <input type="text" placeholder="Phòng">
                </div>
                <div class="input-field">
                    <input type="text" placeholder="Ghi Chú">
                </div>
            </div>

            <div class="config-section">
                <h2>Cấu Hình</h2>
                <div class="input-grid row-4">
                    <div class="input-field">
                        <input type="text" placeholder="Cấu Hình">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="MainBoard">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Bàn Phím">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="VGA">
                    </div>

                    <div class="input-field">
                        <input type="text" placeholder="Màn Hình">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="CPU">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Ổ Cứng">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="HDH">
                    </div>

                    <div class="input-field">
                        <input type="text" placeholder="Chuột">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="RAM">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="Case">
                    </div>
                    <div class="input-field">
                        <input type="text" placeholder="PSU">
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-add">Thêm Mới</button>
                <button class="btn-update">Cập Nhật</button>
                <button class="btn-delete">Xóa</button>
                <button class="btn-refresh">Làm Mới</button>
            </div>

            <div class="search-area">
                <div class="input-field search-input-wrapper">
                    <input type="text" placeholder="Tìm Kiếm">
                </div>
                <button class="btn-search">Tìm Kiếm</button>
            </div>
            
        </div>
    </div>

</body>
</html>
