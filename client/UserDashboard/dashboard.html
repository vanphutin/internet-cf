<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Internet Café – Gaming Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cyan: #00eaff;
        --magenta: #ff00ff;
        --green: #00ff41;
        --cyan-glow: 0 0 10px #00eaff, 0 0 20px #00eaff50, 0 0 30px #00eaff30;
        --magenta-glow: 0 0 10px #ff00ff, 0 0 20px #ff00ff50, 0 0 30px #ff00ff30;
        --green-glow: 0 0 10px #00ff41, 0 0 20px #00ff41 50, 0 0 30px #00ff41 30;
        --dark-bg: #000;
        --panel-bg: rgba(0, 20, 30, 0.85);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0a0a0a 0%, #000 50%, #1a0a1a 100%);
        background-attachment: fixed;
        font-family: "Rajdhani", sans-serif;
        color: var(--cyan);
        overflow: hidden;
        position: relative;
      }
      /* Scanlines overlay for CRT effect */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.05) 0px,
          transparent 1px,
          transparent 2px
        );
        pointer-events: none;
        z-index: 100;
        opacity: 0.3;
      }
      /* Grid overlay */
      .grid {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(
            rgba(0, 234, 255, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(0, 234, 255, 0.1) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -1;
        animation: gridMove 20s linear infinite;
      }
      @keyframes gridMove {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(50px, 50px);
        }
      }
      /* Glitch effect */
      .glitch {
        position: relative;
      }
      .glitch::before,
      .glitch::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.8;
      }
      .glitch::before {
        animation: glitch-1 2s infinite;
        color: var(--magenta);
        z-index: -1;
      }
      .glitch::after {
        animation: glitch-2 2s infinite;
        color: var(--green);
        z-index: -2;
      }
      @keyframes glitch-1 {
        0%,
        95% {
          transform: translate(0);
        }
        97% {
          transform: translate(-2px, 2px);
        }
        99% {
          transform: translate(2px, -2px);
        }
        100% {
          transform: translate(0);
        }
      }
      @keyframes glitch-2 {
        0%,
        90% {
          transform: translate(0);
        }
        92% {
          transform: translate(3px, -1px);
        }
        94% {
          transform: translate(-1px, 3px);
        }
        100% {
          transform: translate(0);
        }
      }
      /* Header with glitch */
      .header {
        text-align: center;
        padding: 20px 0;
        font-size: 36px;
        font-weight: 700;
        font-family: "Orbitron", sans-serif;
        text-shadow: var(--cyan-glow);
        letter-spacing: 3px;
        position: relative;
        z-index: 10;
      }
      .header.glitch {
        data-text: "INTERNET CAFÉ GAMING SYSTEM";
      }
      /* Taskbar-like bottom bar */
      .taskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 40px;
        background: rgba(0, 0, 0, 0.8);
        border-top: 1px solid var(--cyan);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 50;
        box-shadow: 0 -2px 10px rgba(0, 234, 255, 0.2);
      }
      .taskbar .start-btn {
        background: var(--cyan);
        color: var(--dark-bg);
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        text-shadow: none;
        box-shadow: var(--cyan-glow);
      }
      .taskbar .time {
        color: var(--cyan);
        font-size: 14px;
        font-family: "Orbitron", sans-serif;
      }
      /* Main container */
      .container {
        width: 95%;
        max-width: 1600px;
        margin: auto;
        display: flex;
        gap: 20px;
        height: calc(100vh - 120px);
        padding: 20px;
        position: relative;
        z-index: 5;
      }
      /* LEFT PANEL - Like Windows sidebar */
      .left-panel {
        width: 300px;
        background: linear-gradient(
          145deg,
          rgba(0, 20, 30, 0.9),
          rgba(0, 10, 20, 0.9)
        );
        border: 1px solid rgba(0, 234, 255, 0.3);
        padding: 25px;
        border-radius: 12px;
        backdrop-filter: blur(15px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: inset 0 0 20px rgba(0, 234, 255, 0.1),
          0 0 20px rgba(0, 234, 255, 0.2);
        position: relative;
        overflow: hidden;
      }
      .left-panel::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(0, 234, 255, 0.05) 0%,
          transparent 70%
        );
        animation: rotate 20s linear infinite;
        z-index: -1;
      }
      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .avatar-box {
        text-align: center;
        position: relative;
      }
      .avatar-box img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid var(--cyan);
        box-shadow: var(--cyan-glow);
        transition: transform 0.3s ease;
      }
      .avatar-box img:hover {
        transform: scale(1.05) rotate(5deg);
      }
      .username {
        margin-top: 12px;
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        text-shadow: var(--cyan-glow);
        font-family: "Orbitron", sans-serif;
      }
      .info-box {
        margin-top: 25px;
        padding: 15px;
        background: rgba(0, 40, 60, 0.5);
        border-left: 3px solid var(--cyan);
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 234, 255, 0.1);
      }
      .label {
        font-size: 12px;
        opacity: 0.7;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .value {
        font-size: 16px;
        margin-bottom: 12px;
        color: #fff;
        font-weight: 600;
      }
      .logout-btn {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        border: none;
        background: linear-gradient(45deg, #ff2f2f, #ff5050);
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 0 15px #ff2f2f50;
        transition: all 0.3s ease;
        font-family: "Orbitron", sans-serif;
      }
      .logout-btn:hover {
        background: linear-gradient(45deg, #ff5050, #ff2f2f);
        box-shadow: 0 0 20px #ff2f2f80;
        transform: translateY(-2px);
      }
      /* RIGHT PANEL - Main content area */
      .right-panel {
        flex: 1;
        background: linear-gradient(
          145deg,
          rgba(0, 15, 25, 0.9),
          rgba(10, 5, 15, 0.9)
        );
        padding: 25px;
        border-radius: 12px;
        border: 1px solid rgba(0, 234, 255, 0.3);
        overflow-y: auto;
        box-shadow: 0 0 20px rgba(0, 234, 255, 0.15);
        position: relative;
      }
      .right-panel::-webkit-scrollbar {
        width: 8px;
      }
      .right-panel::-webkit-scrollbar-track {
        background: rgba(0, 20, 30, 0.5);
      }
      .right-panel::-webkit-scrollbar-thumb {
        background: var(--cyan);
        border-radius: 4px;
      }
      .section-title {
        font-size: 22px;
        margin: 25px 0 15px;
        border-left: 4px solid var(--cyan);
        padding-left: 15px;
        text-shadow: var(--cyan-glow);
        font-family: "Orbitron", sans-serif;
        position: relative;
        display: inline-block;
      }
      .section-title::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 234, 255, 0.2),
          transparent
        );
        animation: shimmer 3s infinite;
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100px);
        }
        100% {
          transform: translateX(200px);
        }
      }
      /* GAME BANNER - Horizontal scroll with glow */
      .game-banner {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding-bottom: 15px;
        scrollbar-width: thin;
      }
      .game-banner img {
        height: 140px;
        border-radius: 12px;
        border: 2px solid rgba(0, 234, 255, 0.4);
        box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
        transition: all 0.3s ease;
        flex-shrink: 0;
        min-width: 200px;
      }
      .game-banner img:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px rgba(0, 234, 255, 0.6);
        border-color: var(--cyan);
      }
      .game-banner::-webkit-scrollbar {
        height: 6px;
      }
      .game-banner::-webkit-scrollbar-track {
        background: transparent;
      }
      .game-banner::-webkit-scrollbar-thumb {
        background: var(--cyan);
        border-radius: 3px;
      }
      /* UPTIME - Digital clock with glow and pulse */
      .uptime-box {
        font-size: 48px;
        text-align: center;
        padding: 30px;
        text-shadow: var(--cyan-glow);
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        letter-spacing: 3px;
        background: rgba(0, 20, 30, 0.6);
        border: 2px solid var(--cyan);
        border-radius: 12px;
        margin: 20px 0;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: var(--cyan-glow);
        }
        50% {
          box-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff50, 0 0 60px #00eaff30;
        }
      }
      /* MENU GRID - Icon-like grid with hover effects */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 20px;
        padding: 10px;
      }
      .menu-item {
        background: linear-gradient(
          145deg,
          rgba(0, 40, 60, 0.7),
          rgba(0, 20, 40, 0.7)
        );
        border: 1px solid rgba(0, 234, 255, 0.3);
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        color: #fff;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .menu-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 234, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }
      .menu-item:hover::before {
        left: 100%;
      }
      .menu-item:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 10px 20px rgba(0, 234, 255, 0.3);
        border-color: var(--cyan);
      }
      .menu-item .name {
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 16px;
        text-shadow: 0 0 5px rgba(0, 234, 255, 0.5);
      }
      .menu-item .price {
        color: var(--green);
        font-weight: bold;
        font-size: 18px;
        text-shadow: var(--green-glow);
      }
      .menu-item .stock {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 5px;
        color: #ccc;
      }
      /* Loading spinner */
      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(0, 234, 255, 0.3);
        border-radius: 50%;
        border-top-color: var(--cyan);
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="scanlines"></div>
    <div class="grid"></div>
    <div class="header glitch" data-text="INTERNET CAFÉ GAMING SYSTEM">
      INTERNET CAFÉ GAMING SYSTEM
    </div>
    <div class="taskbar">
      <button class="start-btn">START</button>
      <div class="time" id="currentTime"></div>
    </div>
    <div class="container">
      <!-- LEFT PANEL -->
      <div class="left-panel">
        <div>
          <div class="avatar-box">
            <img id="avatar" src="" alt="Avatar" />
            <div class="username" id="username"></div>
          </div>
          <div class="info-box">
            <div class="label">Họ tên</div>
            <div class="value" id="name"></div>
            <div class="label">Số dư</div>
            <div class="value" id="balance"></div>
            <div class="label">Máy đang dùng (IP)</div>
            <div class="value" id="computer">Đang lấy IP...</div>
            <div class="label">Email</div>
            <div class="value" id="email"></div>
            <div class="label">Điện thoại</div>
            <div class="value" id="phone"></div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">ĐĂNG XUẤT</button>
      </div>
      <!-- RIGHT PANEL -->
      <div class="right-panel">
        <div class="section-title">Game đang hot</div>
        <div class="game-banner">
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/570/header.jpg"
            alt="Dota 2"
          />
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg"
            alt="CS:GO"
          />
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/1599340/header.jpg"
            alt="Cyberpunk 2077"
          />
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/271590/header.jpg"
            alt="GTA V"
          />
          <img
            src="https://cdn.cloudflare.steamstatic.com/steam/apps/578080/header.jpg"
            alt="PUBG"
          />
        </div>
        <div class="section-title">Thời gian sử dụng</div>
        <div class="uptime-box" id="uptime">00:00:00</div>
        <div class="section-title">Menu đồ uống & đồ ăn</div>
        <div class="menu-grid" id="menuGrid">
          <div class="loading"></div>
          Đang tải...
        </div>
      </div>
    </div>
    <script>
      // Update current time in taskbar
      function updateTime() {
        const now = new Date();
        document.getElementById("currentTime").innerText =
          now.toLocaleTimeString("vi-VN");
      }
      setInterval(updateTime, 1000);
      updateTime();

      // Function to fetch IP address
      async function fetchIP() {
        try {
          const response = await fetch("https://api.ipify.org?format=json");
          const data = await response.json();
          return data.ip;
        } catch (error) {
          console.error("Error fetching IP:", error);
          return "Không thể lấy IP";
        }
      }

      // ----- USER -----
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) window.location.href = "login.html";
      document.getElementById("username").innerText = user.username;
      document.getElementById("name").innerText = user.name;
      document.getElementById("balance").innerText = user.balance + " VND";
      document.getElementById("email").innerText = user.email || "—";
      document.getElementById("phone").innerText = user.phone || "—";
      document.getElementById(
        "avatar"
      ).src = `https://api.dicebear.com/7.x/bottts/svg?seed=${user.username}`;

      // Fetch and set IP address (replacing current_computer_id logic)
      fetchIP().then((ip) => {
        const computerElement = document.getElementById("computer");
        if (user.current_computer_id) {
          computerElement.innerText = `${user.current_computer_id} (${ip})`;
        } else {
          computerElement.innerText = ip || "Chưa sử dụng";
        }
      });

      // ----- UPTIME -----
      const start = Date.now();
      function formatTime(ms) {
        const sec = Math.floor(ms / 1000) % 60;
        const min = Math.floor(ms / 60000) % 60;
        const hr = Math.floor(ms / 3600000);
        return `${String(hr).padStart(2, "0")}:${String(min).padStart(
          2,
          "0"
        )}:${String(sec).padStart(2, "0")}`;
      }
      setInterval(() => {
        document.getElementById("uptime").innerText = formatTime(
          Date.now() - start
        );
      }, 1000);

      // ----- MENU -----
      fetch("http://localhost:3000/api/v1/menu")
        .then((res) => res.json())
        .then((json) => {
          const grid = document.getElementById("menuGrid");
          grid.innerHTML = "";
          json.data.forEach((item) => {
            const div = document.createElement("div");
            div.className = "menu-item";
            div.innerHTML = `
              <div class="name">${item.name}</div>
              <div class="price">${item.price} USD</div>
              <div class="stock">Còn: ${item.stock}</div>
            `;
            grid.appendChild(div);
          });
        })
        .catch((err) => {
          document.getElementById("menuGrid").innerText = "Không thể tải menu.";
        });

      // ----- LOGOUT -----
      function logout() {
        localStorage.clear();
        window.location.href = "login.html";
      }

      // Add subtle mouse trail effect for gaming feel
      document.addEventListener("mousemove", (e) => {
        const trail = document.createElement("div");
        trail.style.position = "fixed";
        trail.style.left = e.pageX + "px";
        trail.style.top = e.pageY + "px";
        trail.style.width = "4px";
        trail.style.height = "4px";
        trail.style.background = "var(--cyan)";
        trail.style.borderRadius = "50%";
        trail.style.pointerEvents = "none";
        trail.style.zIndex = "999";
        trail.style.opacity = "0.5";
        document.body.appendChild(trail);
        setTimeout(() => trail.remove(), 300);
      });
    </script>
  </body>
</html>
