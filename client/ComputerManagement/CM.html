<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Management - Internet Cafe</title>
    <link rel="stylesheet" href="CM.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <a href="#">InternetCafe</a>
        </div>

        <ul class="sidebar-menu">
            <li>Dashboard</li>
            <li>Account</li>
            <li class="active">Computer Management</li>
            <li>Customer Management</li>
            <li>Reports & Statistics</li>
            <li>Setting</li>
        </ul>

        <div class="logout-section">
            <button class="logout-button">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <div class="card-header">
            <h1>Computer Management</h1>
        </div>

        <div class="management-card">

            <!-- THÔNG TIN CƠ BẢN -->
            <div class="input-grid row-2">
                <div class="input-field">
                    <input id="computerId" type="text" placeholder="Mã Máy">
                </div>
                <div class="input-field">
                    <input id="computerName" type="text" placeholder="Tên Máy">
                </div>
                <div class="input-field">
                    <input id="room" type="text" placeholder="Phòng">
                </div>
                <div class="input-field">
                    <input id="note" type="text" placeholder="Ghi Chú">
                </div>
            </div>

            <!-- CẤU HÌNH -->
            <div class="config-section">
                <h2>Cấu Hình</h2>
                <div class="input-grid row-4">
                    <div class="input-field">
                        <input id="config" type="text" placeholder="Cấu Hình">
                    </div>
                    <div class="input-field">
                        <input id="mainboard" type="text" placeholder="MainBoard">
                    </div>
                    <div class="input-field">
                        <input id="keyboard" type="text" placeholder="Bàn Phím">
                    </div>
                    <div class="input-field">
                        <input id="vga" type="text" placeholder="VGA">
                    </div>

                    <div class="input-field">
                        <input id="monitor" type="text" placeholder="Màn Hình">
                    </div>
                    <div class="input-field">
                        <input id="cpu" type="text" placeholder="CPU">
                    </div>
                    <div class="input-field">
                        <input id="storage" type="text" placeholder="Ổ Cứng">
                    </div>
                    <div class="input-field">
                        <input id="os" type="text" placeholder="HDH">
                    </div>

                    <div class="input-field">
                        <input id="mouse" type="text" placeholder="Chuột">
                    </div>
                    <div class="input-field">
                        <input id="ram" type="text" placeholder="RAM">
                    </div>
                    <div class="input-field">
                        <input id="case" type="text" placeholder="Case">
                    </div>
                    <div class="input-field">
                        <input id="psu" type="text" placeholder="PSU">
                    </div>
                </div>
            </div>

            <!-- BUTTON CRUD -->
            <div class="action-buttons">
                <button id="btnAdd" class="btn-add">Thêm Mới</button>
                <button id="btnUpdate" class="btn-update">Cập Nhật</button>
                <button id="btnDelete" class="btn-delete">Xóa</button>
                <button id="btnRefresh" class="btn-refresh">Làm Mới</button>
            </div>

            <!-- TÌM KIẾM -->
            <div class="search-area">
                <div class="input-field search-input-wrapper">
                    <input id="searchInput" type="text" placeholder="Tìm Kiếm">
                </div>
                <button id="btnSearch" class="btn-search">Tìm Kiếm</button>
            </div>

        </div>

        <!-- BẢNG DANH SÁCH MÁY TÍNH -->
        <table class="customer-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên Máy</th>
                    <th>Phòng</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

<script src="../js/api_config.js"></script>
<script src="../js/computer_manager.js"></script>
</body>
</html>
