<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternetCafe Pro Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Bảng màu mới sang trọng hơn
                        sidebar: '#0f172a', // Slate-900 sâu hơn
                        'sidebar-hover': '#1e293b', // Slate-800
                        'accent': '#3b82f6', // Blue-500 tươi sáng làm điểm nhấn
                        'main-bg': '#f8fafc', // Slate-50 rất sáng
                        
                        // Màu trạng thái pastel
                        'success-bg': '#dcfce7', // Green-100
                        'success-text': '#166534', // Green-800
                        'warning-bg': '#fef9c3', // Yellow-100
                        'warning-text': '#854d0e', // Yellow-800
                        'info-bg': '#dbeafe', // Blue-100
                        'info-text': '#1e40af', // Blue-800
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        // Bóng đổ mềm mại tùy chỉnh
                        'soft-xl': '0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.01)',
                        'glow': '0 0 15px rgba(59, 130, 246, 0.5)', // Hiệu ứng phát sáng nhẹ
                    },
                    borderRadius: {
                        '3xl': '1.5rem', // Bo góc lớn hơn
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="CM.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-main-bg font-sans text-slate-700 antialiased tracking-tight">

<div class="flex min-h-screen bg-main-bg">

    <aside class="w-72 bg-sidebar text-slate-300 flex flex-col shadow-2xl z-20 transition-all">
        <div class="p-8 flex items-center space-x-4 mb-6">
            <div class="bg-gradient-to-tr from-blue-600 to-cyan-500 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <div>
                 <h1 class="text-2xl font-extrabold text-white tracking-tight">CyberMaster</h1>
                 <p class="text-xs text-slate-400 font-medium">Manager Pro v2.0</p>
            </div>
           
        </div>

        <nav class="flex-1 px-6 space-y-3">
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[1.35rem] w-[1.35rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                <span class="font-semibold">Dashboard</span>
            </a>
            <a href="#" class="nav-item active">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[1.35rem] w-[1.35rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                <span class="font-semibold">Quản lý máy tính</span>
            </a>
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[1.35rem] w-[1.35rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                <span class="font-semibold">Khách hàng</span>
            </a>
            <a href="#" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-[1.35rem] w-[1.35rem]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                <span class="font-semibold">Báo cáo & Thống kê</span>
            </a>
        </nav>

        <div class="p-6 mt-auto">
            <a href="#" class="nav-item bg-slate-800/50 hover:bg-red-500/10 hover:text-red-400 group border border-slate-700/50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:text-red-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                <span class="font-medium">Đăng xuất</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6">
            <div>
                <h2 class="text-4xl font-extrabold text-slate-800 tracking-tight mb-2">Danh sách thiết bị</h2>
                <p class="text-slate-500 font-medium">Quản lý trạng thái hoạt động của phòng máy.</p>
            </div>

            <div class="search-bar-container group">
                <div class="text-slate-400 group-focus-within:text-accent transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>
                <input type="text" id="search" placeholder="Tìm kiếm máy, IP..." class="search-input" onkeyup="loadComputers()">
            </div>
        </div>

        <div id="computerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <p class="col-span-full text-center text-slate-400 italic py-16 text-lg font-medium animate-pulse">Đang tải dữ liệu...</p>
        </div>

        <div class="mt-16 bg-white rounded-[2rem] shadow-soft-xl border border-slate-100 p-10 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-accent/10 rounded-full blur-3xl pointer-events-none"></div>

            <h2 class="text-2xl font-bold text-slate-800 mb-8 flex items-center relative z-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-accent mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                Thông tin chi tiết & Thao tác
            </h2>

            <input type="hidden" id="computerIdHidden">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10 relative z-10">
                <div class="form-group">
                    <label for="pcName" class="block text-sm font-bold text-slate-700 mb-2 ml-1">Tên thiết bị</label>
                    <input id="pcName" class="input-modern" type="text" placeholder="VD: Máy trạm 01">
                </div>
                <div class="form-group">
                    <label for="pcIP" class="block text-sm font-bold text-slate-700 mb-2 ml-1">Địa chỉ IP</label>
                    <input id="pcIP" class="input-modern" type="text" placeholder="VD: 192.168.1.101">
                </div>
                
                <div class="form-group">
                    <label for="pcLocation" class="block text-sm font-bold text-slate-700 mb-2 ml-1">Vị trí lắp đặt</label>
                    <input id="pcLocation" class="input-modern" type="text" placeholder="VD: Khu A - Dãy 1">
                </div>
                 <div class="form-group">
                    <label for="pcStatus" class="block text-sm font-bold text-slate-700 mb-2 ml-1">Trạng thái hiện tại</label>
                    <div class="relative">
                        <select id="pcStatus" class="input-modern appearance-none pr-10 cursor-pointer font-semibold">
                            <option value="available" class="text-success-text">Sẵn sàng (Available)</option>
                            <option value="in_use" class="text-info-text">Đang sử dụng (In Use)</option>
                            <option value="maintenance" class="text-warning-text">Bảo trì (Maintenance)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 relative z-10 border-t border-slate-100 pt-8">
                <button class="btn-modern btn-blue" onclick="addComputer()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" /></svg>
                    Thêm mới
                </button>
                <button class="btn-modern btn-green" onclick="updateComputer()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v3.292a1 1 0 11-2 0V16a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                    Cập nhật
                </button>
                <button class="btn-modern btn-red ml-auto" onclick="deleteComputer()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                    Xóa thiết bị
                </button>
                <button class="btn-modern btn-gray" onclick="clearForm()">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Làm mới
                </button>
            </div>
        </div>

    </main>
</div>

<div id="toast" class="fixed top-8 right-8 hidden px-6 py-4 bg-white text-slate-800 rounded-2xl shadow-2xl border-l-4 border-accent font-semibold z-50 transition-all duration-500 transform translate-y-[-30px] opacity-0 flex items-center">
    <span id="toast-msg">Thông báo</span>
</div>

<script src="computers.js"></script>

</body>
</html>
