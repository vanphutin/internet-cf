<section class="auth-section">
  <div class="auth-card">
    <div class="auth-info">
      <h1>Internet Cafe Manager</h1>
      <p>Quản lý phòng máy hiện đại, trực quan và dễ sử dụng.</p>

      <ul class="auth-features">
        <li>✔ Quản lý máy &amp; khách hàng theo thời gian thực</li>
        <li>✔ Thống kê doanh thu, giờ chơi, sản phẩm</li>
        <li>✔ Phân quyền tài khoản nhân viên</li>
      </ul>
    </div>

    <div class="auth-form-wrapper">
      <h2>Đăng nhập</h2>
      <p class="auth-subtitle">Đăng nhập để bắt đầu phiên làm việc</p>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="login-username">Tên đăng nhập</label>
          <input
            type="text"
            id="login-username"
            name="username"
            placeholder="admin"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="login-password">Mật khẩu</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-primary full-width">Đăng nhập</button>
      </form>
    </div>
  </div>
</section>
